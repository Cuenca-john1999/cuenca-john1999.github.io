<svg viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hypothesis-title hypothesis-desc">
  <title id="hypothesis-title">Conceptual diagram of the phage and chitosan hypothesis</title>
  <desc id="hypothesis-desc">Simplified diagram showing bacteriophages and chitosan interacting with a bacterial biofilm associated with microplastics.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="bacteria" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1bd7f2"/>
      <stop offset="1" stop-color="#1197d4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="720" height="540" rx="24" fill="url(#panel)"/>
  <rect x="18" y="18" width="684" height="504" rx="20" fill="none" stroke="#4F8CFF" stroke-opacity="0.24"/>

