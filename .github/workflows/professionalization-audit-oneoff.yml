name: One-off professionalization audit

on:
  push:
    branches:
      - audit/professionalization-2026-08-07

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply conservative professionalization changes
        run: python3 .github/scripts/professionalization_patch.py

      - name: Verify content, links and syntax
        run: |
          python3 tools/verify_portfolio_integrity.py
          node --check assets/js/language.js
          node --check assets/js/app.js
          node --check assets/js/auxiliary-pages.js
          node --check workbench/js/workbench.js
          git diff --check

      - name: Commit audited changes and remove temporary audit files
        run: |
          rm .github/workflows/professionalization-audit-oneoff.yml
          rm .github/scripts/professionalization_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/portfolio-integrity.yml \
            .github/workflows/professionalization-audit-oneoff.yml \
            .github/scripts/professionalization_patch.py \
            404.html \
            privacy.html \
            assets/css/legal.css \
            assets/js/auxiliary-pages.js \
            assets/js/language.js \
            data/translations/en.json \
            data/translations/de.json \
            data/translations/es.json \
            index.html \
            sitemap.xml \
            tools/verify_portfolio_integrity.py
          git diff --cached --check
          git diff --cached --name-status
          git diff --cached --stat
          git commit -m "feat: strengthen portfolio privacy SEO and integrity"
          git push origin HEAD:audit/professionalization-2026-08-07
