name: Apply expandable card alignment update

on:
  push:
    branches:
      - fix/expandable-card-alignment
    paths:
      - .github/workflows/apply-expandable-card-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/expandable-card-alignment

      - name: Update component cache token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'assets/css/components.css?v=27a2a07ec148'
          new = 'assets/css/components.css?v=5ae64686c468'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old components token; found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Regenerate localized profile routes
        run: python3 tools/generate_localized_pages.py

      - name: Verify integrity
        run: |
          python3 tools/verify_portfolio_integrity.py
          python3 tools/verify_workbench_evidence.py
          python3 tools/verify_workbench_split.py
          python3 tools/generate_localized_pages.py --check
          node --check assets/js/language.js
          node --check assets/js/app.js
          node --check workbench/js/workbench-data.js
          node --check workbench/js/workbench.js
          git diff --check

      - name: Commit generated cache updates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html de/index.html es/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh localized component cache token'
          git push origin HEAD:fix/expandable-card-alignment
