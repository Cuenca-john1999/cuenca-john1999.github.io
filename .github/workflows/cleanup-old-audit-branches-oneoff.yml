name: Cleanup obsolete audit branches

on:
  push:
    branches:
      - audit/professionalization-2026-08-07

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only obsolete audit refs
        run: |
          git push origin --delete \
            audit/improvements-2026-08-07 \
            backup/pre-audit-2026-08-07-d5e9b50
