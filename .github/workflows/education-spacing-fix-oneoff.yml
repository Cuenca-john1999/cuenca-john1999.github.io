name: Education spacing fix one-off

on:
  push:
    branches:
      - audit/education-visual-2026-08-07

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/education-visual-2026-08-07
          fetch-depth: 0

      - name: Apply scoped education spacing fix
        run: python tools/apply_education_spacing_fix.py

      - name: Verify integrity and diff
        run: |
          python tools/verify_portfolio_integrity.py
          git diff --check

      - name: Commit scoped CSS fix
        run: |
          set -euo pipefail
          git config user.name 'Jhon M. Cuenca'
          git config user.email '72253286+Cuenca-john1999@users.noreply.github.com'
          git add assets/css/layout.css
          git diff --cached --check
          git commit -m 'fix: keep education details aligned with card content'
          git push origin HEAD:audit/education-visual-2026-08-07
