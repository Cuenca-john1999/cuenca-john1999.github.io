name: Apply multilingual SEO architecture v4

on:
  push:
    branches:
      - audit-3p/ronda-7-seo-multilingue

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-3p/ronda-7-seo-multilingue
      - name: Harden localized generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/generate_localized_pages.py')
          text = path.read_text(encoding='utf-8')

          old_profile = '''    source = replace_once(
                  source,
                  f'"url": "{BASE_URL}/",',
                  f'"url": "{url}",',
                  "localized ProfilePage url",
              )'''
          new_profile = '''    profile_url = f'"url": "{BASE_URL}/",'
              if profile_url not in source:
                  raise SystemExit("[localized-pages] missing ProfilePage url")
              source = source.replace(profile_url, f'"url": "{url}",', 1)'''
          if text.count(old_profile) != 1:
              raise SystemExit(f'expected one ProfilePage replacement block, found {text.count(old_profile)}')
          text = text.replace(old_profile, new_profile, 1)

          old_outputs = '''def outputs() -> dict[Path, str]:
              return {
                  ROOT / "de" / "index.html": render_main("de"),
                  ROOT / "es" / "index.html": render_main("es"),
                  ROOT / "de" / "workbench" / "index.html": render_workbench("de"),
                  ROOT / "es" / "workbench" / "index.html": render_workbench("es"),
                  ROOT / "sitemap.xml": render_sitemap(),
              }'''
          new_outputs = '''def normalize_generated_html(text: str) -> str:
              return "\\n".join(line.rstrip() for line in text.splitlines()) + "\\n"


          def outputs() -> dict[Path, str]:
              return {
                  ROOT / "de" / "index.html": normalize_generated_html(render_main("de")),
                  ROOT / "es" / "index.html": normalize_generated_html(render_main("es")),
                  ROOT / "de" / "workbench" / "index.html": normalize_generated_html(render_workbench("de")),
                  ROOT / "es" / "workbench" / "index.html": normalize_generated_html(render_workbench("es")),
                  ROOT / "sitemap.xml": render_sitemap(),
              }'''
          if text.count(old_outputs) != 1:
              raise SystemExit(f'expected one outputs block, found {text.count(old_outputs)}')
          text = text.replace(old_outputs, new_outputs, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply SEO architecture
        run: python3 tools/apply_multilingual_seo.py
      - name: Verify generated localized pages
        run: python3 tools/generate_localized_pages.py --check
      - name: Verify syntax and diffs
        run: |
          node --check assets/js/language.js
          node --check workbench/js/workbench.js
          git diff --check
      - name: Commit site changes without workflow mutation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html \
            workbench/index.html \
            privacy.html \
            404.html \
            assets/js/language.js \
            workbench/js/workbench.js \
            tools/generate_localized_pages.py \
            de/index.html \
            de/workbench/index.html \
            es/index.html \
            es/workbench/index.html \
            sitemap.xml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No SEO site changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add canonical German and Spanish SEO routes'
          git push origin HEAD:audit-3p/ronda-7-seo-multilingue
