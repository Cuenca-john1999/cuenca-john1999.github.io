name: Temporary remove FCT hours

on:
  push:
    branches:
      - fix/remove-fct-hours

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-fct-hours
          fetch-depth: 0

      - name: Remove FCT hour counts only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('index.html'),
              Path('de/index.html'),
              Path('es/index.html'),
              Path('workbench/index.html'),
              Path('de/workbench/index.html'),
              Path('es/workbench/index.html'),
              Path('workbench/js/workbench-data.js'),
              Path('data/translations/en.json'),
              Path('data/translations/de.json'),
              Path('data/translations/es.json'),
          ]

          replacements = {
              ' · 370 h': '',
              ' · 370 Std.': '',
              ' · 370 hours': '',
              '2025 · 370-hour FCT placement at Hospital Universitario de La Princesa': '2025 · FCT placement at Hospital Universitario de La Princesa',
              '2025 · Prácticas FCT de 370 horas en el Hospital Universitario de La Princesa': '2025 · Prácticas FCT en el Hospital Universitario de La Princesa',
              '2025 · 370-stündiges FCT-Praktikum am Hospital Universitario de La Princesa': '2025 · FCT-Praktikum am Hospital Universitario de La Princesa',
              '370-hour FCT placement in 2025 at': 'FCT placement in 2025 at',
              'The 370-hour FCT placement and its context are documented.': 'The FCT placement and its context are documented.',
              'Prácticas FCT de 370 horas en 2025 en': 'Prácticas FCT en 2025 en',
              'Las prácticas FCT de 370 horas y su contexto están documentados.': 'Las prácticas FCT y su contexto están documentados.',
              'FCT-Praktikum mit 370 Stunden im Jahr 2025 bei': 'FCT-Praktikum im Jahr 2025 bei',
              'Das 370-stündige FCT-Praktikum und sein Kontext sind dokumentiert.': 'Das FCT-Praktikum und sein Kontext sind dokumentiert.',
          }

          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              before = text
              count = 0
              for old, new in replacements.items():
                  n = text.count(old)
                  count += n
                  text = text.replace(old, new)
              if text != before:
                  path.write_text(text, encoding='utf-8')
              total += count
              print(f'{path}: {count} replacement(s)')

          if total == 0:
              raise SystemExit('No FCT hour strings were found; refusing empty change.')

          forbidden = ('370-hour', '370 hours', '370-stünd', '370 Stunden', '370 h', '370 Std.')
          leftovers = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if any(value in text for value in forbidden):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('FCT hour strings remain in: ' + ', '.join(leftovers))
          PY

      - name: Remove temporary workflow from final diff
        run: rm .github/workflows/temp-remove-fct-hours.yml

      - name: Validate diff
        run: |
          git diff --check
          python3 tools/verify_portfolio_integrity.py
          python3 tools/verify_workbench_evidence.py

      - name: Commit targeted portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            de/index.html \
            es/index.html \
            workbench/index.html \
            de/workbench/index.html \
            es/workbench/index.html \
            workbench/js/workbench-data.js \
            data/translations/en.json \
            data/translations/de.json \
            data/translations/es.json \
            .github/workflows/temp-remove-fct-hours.yml
          git diff --cached --check
          git commit -m "fix: remove FCT placement hour count"
          git push origin HEAD:fix/remove-fct-hours
