name: Workbench audit patch

on:
  push:
    branches: ["audit/improvements-2026-08-07"]
    paths: [".github/workflows/audit-improvements-oneoff.yml"]

permissions:
  contents: write

jobs:
  verify-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/improvements-2026-08-07
      - name: Verify runner
        run: |
          node --version
          python3 --version
