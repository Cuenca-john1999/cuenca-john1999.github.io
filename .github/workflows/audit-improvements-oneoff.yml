name: Workbench audited integrity patch

on:
  push:
    branches: ["audit/improvements-2026-08-07"]
    paths: [".github/workflows/audit-improvements-oneoff.yml"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/improvements-2026-08-07
          fetch-depth: 0

      - name: Apply exact Workbench replacements
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/workbench_patch.py
          python3 /tmp/workbench_patch.py

      - name: Verify syntax and information integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/translations/en.json >/dev/null
          python3 -m json.tool data/translations/de.json >/dev/null
          python3 -m json.tool data/translations/es.json >/dev/null
          node --check assets/js/language.js
          node --check assets/js/app.js
          node --check workbench/js/workbench.js
          git diff --check

          if git grep -n -E 'administration of drugs/substances|administración de fármacos/sustancias|Verabreichung von Arzneimitteln/Substanzen' -- ':!*.pdf'; then
            echo 'Forbidden overclaim wording still present.' >&2
            exit 1
          fi

          grep -Fq 'DeutschOS' index.html
          grep -Fq 'AETEL 2025' index.html
          grep -Fq 'Bacteriophage Therapy' index.html
          grep -Fq 'id="entry-deutschos"' workbench/index.html
          grep -Fq 'id="entry-chitosan"' workbench/index.html
          grep -Fq 'id="entry-phage"' workbench/index.html
          grep -Fq 'id="entry-laprincesa"' workbench/index.html
          grep -Fq 'id="entry-celignis"' workbench/index.html
          grep -Fq 'No experimental validation' index.html
          grep -Fq 'co-authored academic literature review' workbench/index.html
          grep -Fq 'injections' workbench/index.html
          grep -Fq 'included euthanasia; not presented as independent practice' workbench/index.html

          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ('index.html', 'workbench/index.html'):
              text = Path(name).read_text(encoding='utf-8')
              ids = re.findall(r'\bid="([^"]+)"', text)
              duplicates = sorted({item for item in ids if ids.count(item) > 1})
              if duplicates:
                  raise SystemExit(f'{name}: duplicate ids: {duplicates}')
          PY

      - name: Commit audited changes and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-improvements-oneoff.yml
          git add workbench/index.html workbench/js/workbench.js
          git diff --cached --check
          git commit -m 'fix: align Workbench integrity and language routing'
          git push origin HEAD:audit/improvements-2026-08-07
