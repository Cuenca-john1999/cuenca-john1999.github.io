name: Apply multilingual SEO architecture v2

on:
  push:
    branches:
      - audit-3p/ronda-7-seo-multilingue

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-3p/ronda-7-seo-multilingue
      - name: Fix ProfilePage URL targeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/generate_localized_pages.py')
          text = path.read_text(encoding='utf-8')
          old = '''    source = replace_once(
                  source,
                  f'"url": "{BASE_URL}/",',
                  f'"url": "{url}",',
                  "localized ProfilePage url",
              )'''
          new = '''    profile_url = f'"url": "{BASE_URL}/",'
              if profile_url not in source:
                  raise SystemExit("[localized-pages] missing ProfilePage url")
              source = source.replace(profile_url, f'"url": "{url}",', 1)'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one ProfilePage replacement block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply SEO architecture
        run: python3 tools/apply_multilingual_seo.py
      - name: Verify generated localized pages
        run: python3 tools/generate_localized_pages.py --check
      - name: Verify syntax and diffs
        run: |
          node --check assets/js/language.js
          node --check workbench/js/workbench.js
          git diff --check
      - name: Commit SEO architecture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html \
            workbench/index.html \
            privacy.html \
            404.html \
            assets/js/language.js \
            workbench/js/workbench.js \
            .github/workflows/portfolio-integrity.yml \
            tools/generate_localized_pages.py \
            de/index.html \
            de/workbench/index.html \
            es/index.html \
            es/workbench/index.html \
            sitemap.xml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No SEO changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add canonical German and Spanish SEO routes'
          git push origin HEAD:audit-3p/ronda-7-seo-multilingue
