name: Education browser audit one-off

on:
  push:
    branches:
      - audit/education-visual-2026-08-07

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/education-visual-2026-08-07

      - name: Prepare Selenium
        run: |
          python -m pip install --quiet selenium
          google-chrome --version
          chromedriver --version

      - name: Start local site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Audit education UI
        run: |
          mkdir -p /tmp/education-audit
          cat > /tmp/audit.py <<'PY'
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          OUT = Path('/tmp/education-audit')
          failures = []
          results = {}

          def contains(text, expected):
              return expected.casefold() in text.casefold()

          def check(condition, label, detail=''):
              if condition:
                  results[label] = 'PASS'
              else:
                  failures.append(label + (f': {detail}' if detail else ''))
                  results[label] = 'FAIL'

          def severe_console(driver):
              return [x for x in driver.get_log('browser') if x.get('level') == 'SEVERE']

          def open_details(driver, root):
              details = root.find_element(By.CSS_SELECTOR, 'details')
              if not details.get_attribute('open'):
                  driver.execute_script('arguments[0].querySelector("summary").click()', root)
              WebDriverWait(driver, 10).until(lambda d: details.get_attribute('open') is not None)
              return details

          def wait_for_text(root, expected):
              WebDriverWait(driver, 10).until(lambda d: contains(root.text, expected))

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--force-device-scale-factor=1')
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 10)
          try:
              # Desktop is the primary review surface.
              driver.set_window_size(1440, 900)
              driver.get('http://127.0.0.1:4173/?lang=es#education')
              wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]'))
              wait.until(lambda d: d.find_element(By.TAG_NAME, 'html').get_attribute('lang') == 'es')
              check(driver.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1'), 'desktop-no-horizontal-overflow')

              operations = driver.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]')
              open_details(driver, operations)
              wait_for_text(operations, 'Reconocimiento académico')
              text = operations.text
              check('8,69/10' in text, 'desktop-operations-grade')
              check(contains(text, 'Reconocimiento académico'), 'desktop-operations-recognition')
              check('10/10' in text and '9/10' in text, 'desktop-operations-results')
              check(contains(text, 'Evidencia académica aplicada'), 'desktop-operations-evidence')
              check(contains(text, '20 de marzo') and contains(text, '31 de mayo de 2023'), 'desktop-operations-placement-dates')
              link = operations.find_element(By.CSS_SELECTOR, 'a[href*="entry-celignis"]')
              check('#entry-celignis' in link.get_attribute('href'), 'celignis-deep-link-preserved')
              driver.execute_script('arguments[0].scrollIntoView({block:"start"})', operations)
              time.sleep(0.2)
              operations.screenshot(str(OUT / 'desktop-es-operations-open.png'))

              credentials = driver.find_element(By.CSS_SELECTOR, '[data-education-evidence="credentials"]')
              open_details(driver, credentials)
              wait_for_text(credentials, 'Experimentación Animal')
              ctext = credentials.text
              check(len(credentials.find_elements(By.CSS_SELECTOR, '.credential-card')) == 3, 'desktop-credentials-three-cards')
              check(contains(ctext, 'Experimentación Animal'), 'desktop-credential-animal')
              check(contains(ctext, 'Gestión de Centros Sanitarios'), 'desktop-credential-healthcare')
              check(contains(ctext, 'Prevención de Riesgos Laborales'), 'desktop-credential-risk')
              driver.execute_script('arguments[0].scrollIntoView({block:"start"})', credentials)
              time.sleep(0.2)
              credentials.screenshot(str(OUT / 'desktop-es-credentials-open.png'))

              clinical = driver.find_element(By.CSS_SELECTOR, '#education .focus-item:not([data-education-evidence])')
              open_details(driver, clinical)
              wait_for_text(clinical, 'Trabajo final')
              check(contains(clinical.text, 'Trabajo final'), 'desktop-clinical-card-still-intact')
              driver.execute_script('arguments[0].scrollIntoView({block:"start"})', clinical)
              time.sleep(0.2)
              clinical.screenshot(str(OUT / 'desktop-es-clinical-open.png'))

              # New text must resolve in all three languages; wait for async translation load.
              for lang, expected in [('en', 'Academic recognition'), ('de', 'Akademische Auszeichnung'), ('es', 'Reconocimiento académico')]:
                  driver.get(f'http://127.0.0.1:4173/?lang={lang}#education')
                  op = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]'))
                  wait.until(lambda d: d.find_element(By.TAG_NAME, 'html').get_attribute('lang') == lang)
                  open_details(driver, op)
                  wait_for_text(op, expected)
                  check(contains(op.text, expected), f'i18n-new-education-{lang}')

              # Secondary responsive safeguard only.
              driver.set_window_size(390, 800)
              driver.get('http://127.0.0.1:4173/?lang=es#education')
              wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]'))
              check(driver.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1'), 'mobile-no-horizontal-overflow')

              logs = severe_console(driver)
              check(not logs, 'no-severe-console-errors', json.dumps(logs)[:1000])
          finally:
              driver.quit()

          report = {'failures': failures, 'results': results}
          (OUT / 'report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          if failures:
              raise SystemExit(1)
          PY
          python /tmp/audit.py

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-browser-audit-desktop
          path: /tmp/education-audit/
          retention-days: 1
