name: Education browser audit one-off

on:
  push:
    branches:
      - audit/education-visual-2026-08-07

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/education-visual-2026-08-07

      - name: Prepare Selenium
        run: |
          python -m pip install --quiet selenium
          google-chrome --version
          chromedriver --version

      - name: Start local site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Audit education UI
        run: |
          mkdir -p /tmp/education-audit
          cat > /tmp/audit.py <<'PY'
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          OUT = Path('/tmp/education-audit')
          failures = []
          results = {}

          def check(condition, label, detail=''):
              if condition:
                  results[label] = 'PASS'
              else:
                  failures.append(label + (f': {detail}' if detail else ''))
                  results[label] = 'FAIL'

          def severe_console(driver):
              return [x for x in driver.get_log('browser') if x.get('level') == 'SEVERE']

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--force-device-scale-factor=1')
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 10)
          try:
              # Mobile Spanish — primary user-reported scenario.
              driver.set_window_size(390, 800)
              driver.get('http://127.0.0.1:4173/?lang=es#education')
              wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]'))
              time.sleep(0.5)
              check(driver.find_element(By.TAG_NAME, 'html').get_attribute('lang') == 'es', 'mobile-es-language')
              check(driver.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1'), 'mobile-no-horizontal-overflow')

              operations = driver.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]')
              driver.execute_script('arguments[0].scrollIntoView({block:"start"})', operations)
              summary = operations.find_element(By.CSS_SELECTOR, 'summary')
              driver.execute_script('arguments[0].click()', summary)
              time.sleep(0.35)
              text = operations.text
              check('RECONOCIMIENTO ACADÉMICO' in text.upper(), 'operations-recognition-visible')
              check('10/10' in text and '9/10' in text, 'operations-official-results-visible')
              check('EVIDENCIA ACADÉMICA APLICADA' in text.upper(), 'operations-evidence-visible')
              check('20 de marzo' in text and '31 de mayo de 2023' in text, 'operations-fct-dates-visible')
              operations.screenshot(str(OUT / 'mobile-es-operations-open.png'))

              credentials = driver.find_element(By.CSS_SELECTOR, '[data-education-evidence="credentials"]')
              driver.execute_script('arguments[0].scrollIntoView({block:"start"})', credentials)
              summary = credentials.find_element(By.CSS_SELECTOR, 'summary')
              driver.execute_script('arguments[0].click()', summary)
              time.sleep(0.35)
              ctext = credentials.text
              check(len(credentials.find_elements(By.CSS_SELECTOR, '.credential-card')) == 3, 'credentials-three-cards')
              check('Experimentación Animal' in ctext, 'credential-animal-visible')
              check('Gestión de Centros Sanitarios' in ctext, 'credential-healthcare-visible')
              check('Prevención de Riesgos Laborales' in ctext, 'credential-risk-visible')
              check(driver.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1'), 'credentials-mobile-no-overflow')
              credentials.screenshot(str(OUT / 'mobile-es-credentials-open.png'))

              # Existing clinical card remains operational.
              clinical = driver.find_element(By.CSS_SELECTOR, '#education .focus-item:not([data-education-evidence])')
              clinical_summary = clinical.find_element(By.CSS_SELECTOR, 'summary')
              driver.execute_script('arguments[0].click()', clinical_summary)
              check('TRABAJO FINAL' in clinical.text.upper(), 'clinical-card-still-intact')

              # Language switch coverage for newly introduced content.
              for lang, expected in [('en', 'Academic recognition'), ('de', 'Akademische Auszeichnung'), ('es', 'Reconocimiento académico')]:
                  driver.get(f'http://127.0.0.1:4173/?lang={lang}#education')
                  wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]'))
                  op = driver.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]')
                  driver.execute_script('arguments[0].querySelector("summary").click()', op)
                  check(expected in op.text, f'i18n-new-education-{lang}')

              # Desktop layout and Celignis deep link preservation.
              driver.set_window_size(1440, 900)
              driver.get('http://127.0.0.1:4173/?lang=en#education')
              wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]'))
              check(driver.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1'), 'desktop-no-horizontal-overflow')
              op = driver.find_element(By.CSS_SELECTOR, '[data-education-evidence="operations"]')
              link = op.find_element(By.CSS_SELECTOR, 'a[href*="entry-celignis"]')
              check('#entry-celignis' in link.get_attribute('href'), 'celignis-deep-link-preserved')
              section = driver.find_element(By.ID, 'education')
              driver.execute_script('arguments[0].scrollIntoView({block:"start"})', section)
              section.screenshot(str(OUT / 'desktop-en-education.png'))

              logs = severe_console(driver)
              check(not logs, 'no-severe-console-errors', json.dumps(logs)[:1000])
          finally:
              driver.quit()

          report = {'failures': failures, 'results': results}
          (OUT / 'report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          if failures:
              raise SystemExit(1)
          PY
          python /tmp/audit.py

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-browser-audit
          path: /tmp/education-audit/
          retention-days: 1
