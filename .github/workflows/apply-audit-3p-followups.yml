name: Apply 3P audit follow-ups

on:
  push:
    branches:
      - fix/audit-3p-followups-2026-08-09

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/audit-3p-followups-2026-08-09
      - name: Apply audited follow-ups
        run: |
          set -euo pipefail
          python3 tools/apply_audit_3p_followups.py
          python3 tools/normalize_audit_3p_followup_patch.py
          python3 tools/generate_localized_pages.py
      - name: Verify repository integrity
        run: |
          set -euo pipefail
          python3 tools/verify_portfolio_integrity.py
          python3 tools/verify_workbench_evidence.py
          python3 tools/verify_workbench_split.py
          python3 tools/generate_localized_pages.py --check
          node --check assets/js/language.js
          node --check assets/js/app.js
          node --check workbench/js/workbench-data.js
          node --check workbench/js/workbench.js
          node --check assets/js/auxiliary-pages.js
          git diff --check
      - name: Verify public PDFs
        run: |
          set -euo pipefail
          python3 -m pip install 'pypdf==6.15.0'
          python3 tools/verify_public_pdfs.py
      - name: Review diff
        run: |
          set -euo pipefail
          git status --short
          git diff --name-status
          git diff --stat
      - name: Commit audited follow-ups
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html \
            privacy.html \
            404.html \
            assets/js/language.js \
            data/translations/en.json \
            data/translations/de.json \
            data/translations/es.json \
            tools/generate_localized_pages.py \
            tools/verify_portfolio_integrity.py \
            de/index.html \
            es/index.html \
            de/workbench/index.html \
            es/workbench/index.html \
            sitemap.xml
          git diff --cached --check
          git diff --cached --name-status
          git diff --cached --stat
          git commit -m 'fix: apply 3P audit follow-ups'
          git push origin HEAD:fix/audit-3p-followups-2026-08-09
