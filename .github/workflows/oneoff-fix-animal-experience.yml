name: One-off animal experience content fix

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-animal-experience.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify base revision
        shell: bash
        run: |
          set -euo pipefail
          expected="6bdd5471d6afb34c2bb2d102c005da6b4c96890f"
          actual="$(git rev-parse HEAD^)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected parent revision: $actual (expected $expected)" >&2
            exit 1
          fi

      - name: Patch multilingual portfolio content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          updates = {
              'en': {
                  ('experienceCards', 'immunology', 'body'): 'Cell culture and HaCaT handling; medium preparation, passaging and freezing; CD4/CD14 isolation; RNA extraction, PCR and electrophoresis; ELISA; Western blot gel preparation, transfer and blocking; human and murine sample processing; protocol work; and laboratory material and inventory organisation. During supervised animal-sample procedures, I personally performed murine sample collection/extraction and subsequent sample handling.',
                  ('experienceCards', 'immunology', 'role'): 'Biomedical laboratory trainee with progressive responsibility in cell culture workflows, molecular biology support and immunology techniques. During supervised animal-sample procedures, I personally performed murine sample collection/extraction and subsequent handling.',
                  ('educationCards', 'additional', 'body'): 'Animal Experimentation - Functions A+B+C (Order ECC/566/2015) · 70 h with in-person practical training. A: care of animals; B: euthanasia of animals; C: performance of procedures. The programme covers animal welfare and the 3Rs, recognition of pain, suffering and distress, humane killing methods, minimally invasive procedures, anaesthesia for minor procedures, advanced anaesthesia for surgical or prolonged procedures, and principles of surgery. During the supervised practical component, I personally performed animal handling, administration of drugs/substances by injection, anaesthesia, surgical procedures for sample/tissue collection, collection/extraction of animal samples and euthanasia. Healthcare Centre Management · 100 h · 2025. Basic Level Occupational Risk Prevention · 2023.',
                  ('skillsEvidence', 'academic', 'animalModels'): 'Animal Experimentation · Functions A+B+C · 70 h · in-person practical training · care, euthanasia and performance of procedures · anaesthesia and surgical principles',
                  ('responsibilityCards', 'princesa', 'body'): 'My role developed from trainee participation into defined responsibility within the cell-culture workflow. I was trusted with cell handling, maintenance and related routines, and I was frequently called to support animal-sample procedures and molecular-biology or immunology workflows. During supervised animal-sample procedures, I personally performed murine sample collection/extraction and subsequent sample handling.'
              },
              'es': {
                  ('experienceCards', 'immunology', 'body'): 'Cultivo celular y manejo de HaCaT; preparación de medios, pases y congelación; aislamiento CD4/CD14; extracción de ARN, PCR y electroforesis; ELISA; preparación de geles de Western blot, transferencia y bloqueo; procesamiento de muestras humanas y murinas; trabajo con protocolos; y organización de material e inventario de laboratorio. Durante procedimientos supervisados con muestras animales, realicé personalmente la obtención/extracción de muestras murinas y su posterior manejo.',
                  ('experienceCards', 'immunology', 'role'): 'Estudiante en prácticas de laboratorio biomédico con responsabilidad progresiva en flujos de cultivo celular, apoyo en biología molecular y técnicas de inmunología. Durante procedimientos supervisados con muestras animales, realicé personalmente la obtención/extracción de muestras murinas y su posterior manejo.',
                  ('educationCards', 'additional', 'body'): 'Funciones A+B+C en Experimentación Animal (Orden ECC/566/2015) · 70 h con prácticas presenciales. A: cuidado de animales; B: eutanasia; C: realización de procedimientos. El programa incluye bienestar animal y 3R, reconocimiento del dolor, sufrimiento y angustia, métodos humanitarios de sacrificio, procedimientos mínimamente invasivos, anestesia para procedimientos menores, anestesia avanzada para procedimientos quirúrgicos o prolongados y principios de cirugía. Durante la parte práctica supervisada realicé personalmente manejo de animales, administración de fármacos/sustancias mediante inyección, anestesia, procedimientos quirúrgicos para la obtención de muestras/tejidos, obtención/extracción de muestras animales y eutanasia. Gestión de Centros Sanitarios · 100 h · 2025. Prevención de Riesgos Laborales de nivel básico · 2023.',
                  ('skillsEvidence', 'academic', 'animalModels'): 'Experimentación animal · Funciones A+B+C · 70 h · prácticas presenciales · cuidado, eutanasia y realización de procedimientos · anestesia y principios quirúrgicos',
                  ('responsibilityCards', 'princesa', 'body'): 'Mi papel evolucionó desde la participación como estudiante en prácticas hasta una responsabilidad concreta dentro del flujo de cultivo celular. Se me confió el manejo, mantenimiento y rutinas relacionadas con células, y se me llamaba con frecuencia para apoyar procedimientos con muestras animales y flujos de biología molecular o inmunología. Durante procedimientos supervisados con muestras animales, realicé personalmente la obtención/extracción de muestras murinas y su posterior manejo.'
              },
              'de': {
                  ('experienceCards', 'immunology', 'body'): 'Zellkultur und HaCaT-Handling; Medienvorbereitung, Passagieren und Einfrieren; CD4/CD14-Isolierung; RNA-Extraktion, PCR und Elektrophorese; ELISA; Western-Blot-Gelherstellung, Transfer und Blocking; Verarbeitung humaner und muriner Proben; Protokollarbeit sowie Organisation von Labormaterial und Bestand. Bei beaufsichtigten Verfahren mit Tierproben führte ich die Gewinnung/Entnahme muriner Proben persönlich durch und übernahm anschließend deren Handhabung.',
                  ('experienceCards', 'immunology', 'role'): 'Praktikant im biomedizinischen Labor mit wachsender Verantwortung in Zellkulturabläufen, molekularbiologischer Unterstützung und immunologischen Techniken. Bei beaufsichtigten Verfahren mit Tierproben führte ich die Gewinnung/Entnahme muriner Proben persönlich durch und übernahm anschließend deren Handhabung.',
                  ('educationCards', 'additional', 'body'): 'Versuchstierkunde - Funktionen A+B+C (Erlass ECC/566/2015) · 70 Std. mit Präsenzpraxis. A: Pflege der Tiere; B: Tötung/Euthanasie der Tiere; C: Durchführung von Verfahren. Das Programm umfasst Tierwohl und 3R, das Erkennen von Schmerz, Leiden und Angst, tierschutzgerechte Tötungsmethoden, minimalinvasive Verfahren, Anästhesie bei kleineren Eingriffen, fortgeschrittene Anästhesie bei chirurgischen oder länger dauernden Verfahren sowie Grundlagen der Chirurgie. Im beaufsichtigten Praxisteil führte ich persönlich Tierhandling, die Verabreichung von Arzneimitteln/Substanzen per Injektion, Anästhesie, chirurgische Verfahren zur Proben-/Gewebegewinnung, die Gewinnung/Entnahme tierischer Proben und Euthanasie durch. Management von Gesundheitseinrichtungen · 100 Std. · 2025. Grundausbildung im Arbeitsschutz · 2023.',
                  ('skillsEvidence', 'academic', 'animalModels'): 'Versuchstierkunde · Funktionen A+B+C · 70 Std. · Präsenzpraxis · Tierpflege, Tötung/Euthanasie und Durchführung von Verfahren · Anästhesie und chirurgische Grundlagen',
                  ('responsibilityCards', 'princesa', 'body'): 'Meine Rolle entwickelte sich von der Praktikumsteilnahme zu konkreter Verantwortung im Zellkulturworkflow. Mir wurden Zellhandling, Pflege und zugehörige Laborroutinen anvertraut, und ich wurde regelmäßig zur Unterstützung bei Verfahren mit Tierproben sowie molekularbiologischen oder immunologischen Workflows hinzugezogen. Bei beaufsichtigten Verfahren mit Tierproben führte ich die Gewinnung/Entnahme muriner Proben persönlich durch und übernahm anschließend deren Handhabung.'
              }
          }

          for language, language_updates in updates.items():
              path = Path(f'data/translations/{language}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              for key_path, value in language_updates.items():
                  node = data
                  for key in key_path[:-1]:
                      if key not in node:
                          raise KeyError(f'{path}: missing key path {key_path}')
                      node = node[key]
                  if key_path[-1] not in node:
                      raise KeyError(f'{path}: missing key path {key_path}')
                  node[key_path[-1]] = value
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Keep English no-JS fallback content in sync with data/translations/en.json.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          replacements = {
              'Cell culture and HaCaT handling; medium preparation, passaging and freezing; CD4/CD14 isolation; RNA extraction, PCR and electrophoresis; ELISA; Western blot gel preparation, transfer and blocking; human and murine sample processing; protocol work; and laboratory material and inventory organisation.': updates['en'][('experienceCards', 'immunology', 'body')],
              'Biomedical laboratory trainee with progressive responsibility in cell culture workflows, molecular biology support, immunology techniques and animal-sample extraction procedures.': updates['en'][('experienceCards', 'immunology', 'role')],
              'Animal Experimentation - Functions A+B+C (Order ECC/566/2015) · 70 h. Healthcare Centre Management · 100 h · 2025. Basic Level Occupational Risk Prevention · 2023.': updates['en'][('educationCards', 'additional', 'body')],
              'Animal Experimentation course · Functions A+B+C · 70 h · in-person practical training': updates['en'][('skillsEvidence', 'academic', 'animalModels')],
              'My role developed from trainee participation into defined responsibility within the cell-culture workflow. I was trusted with cell handling, maintenance and related routines, and I was frequently called to support animal-sample procedures and molecular-biology or immunology workflows.': updates['en'][('responsibilityCards', 'princesa', 'body')]
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'index.html expected exactly one occurrence, found {count}: {old[:70]}')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          # Workbench: make personal animal-sample extraction explicit in La Princesa.
          wb = Path('workbench/js/workbench.js')
          text = wb.read_text(encoding='utf-8')
          wb_replacements = {
              "Supported day-to-day cell-culture, sample-processing, molecular-biology and immunology workflows under laboratory protocols, together with scientific-database work, material and inventory management, and development of a bilingual scientific website for the research group. The supervised role strengthened reproducibility, assay interpretation and quality-control practice while building greater autonomy.": "Supported day-to-day cell-culture, sample-processing, molecular-biology and immunology workflows under laboratory protocols, together with scientific-database work, material and inventory management, and development of a bilingual scientific website for the research group. The supervised role strengthened reproducibility, assay interpretation and quality-control practice while building greater autonomy. During supervised animal-sample procedures, I personally performed murine sample collection/extraction and subsequent sample handling.",
              "Apoyo diario en flujos de cultivo celular, procesamiento de muestras, biología molecular e inmunología siguiendo protocolos de laboratorio, junto con consulta de bases de datos científicas, gestión de material e inventario y desarrollo de una web científica bilingüe para el grupo de investigación. El trabajo supervisado reforzó la reproducibilidad, la interpretación de ensayos y el control de calidad mientras aumentaba la autonomía.": "Apoyo diario en flujos de cultivo celular, procesamiento de muestras, biología molecular e inmunología siguiendo protocolos de laboratorio, junto con consulta de bases de datos científicas, gestión de material e inventario y desarrollo de una web científica bilingüe para el grupo de investigación. El trabajo supervisado reforzó la reproducibilidad, la interpretación de ensayos y el control de calidad mientras aumentaba la autonomía. Durante procedimientos supervisados con muestras animales, realicé personalmente la obtención/extracción de muestras murinas y su posterior manejo.",
              "Mitarbeit bei täglichen Abläufen in Zellkultur, Probenverarbeitung, Molekularbiologie und Immunologie nach Laborprotokollen sowie Arbeit mit wissenschaftlichen Datenbanken, Material- und Bestandsverwaltung und Entwicklung einer zweisprachigen wissenschaftlichen Website für die Forschungsgruppe. Die angeleitete Tätigkeit stärkte Reproduzierbarkeit, Assay-Interpretation und Qualitätskontrolle bei wachsender Eigenständigkeit.": "Mitarbeit bei täglichen Abläufen in Zellkultur, Probenverarbeitung, Molekularbiologie und Immunologie nach Laborprotokollen sowie Arbeit mit wissenschaftlichen Datenbanken, Material- und Bestandsverwaltung und Entwicklung einer zweisprachigen wissenschaftlichen Website für die Forschungsgruppe. Die angeleitete Tätigkeit stärkte Reproduzierbarkeit, Assay-Interpretation und Qualitätskontrolle bei wachsender Eigenständigkeit. Bei beaufsichtigten Verfahren mit Tierproben führte ich die Gewinnung/Entnahme muriner Proben persönlich durch und übernahm anschließend deren Handhabung.",
              "Documented scope includes serum, peripheral blood, immune cells, cell lines and primary rat cells; cytokine-stimulated and adherent cell cultures, including HaCaT; sterile technique, media preparation, passaging and freezing; Buffy Coat handling and CD4/CD14 isolation; human samples in psoriasis, dermatitis and hidradenitis suppurativa contexts; animal samples and murine lymphoid organs; RNA extraction, PCR, electrophoresis and transgenic-mouse genotyping; ELISA; Western blot gel casting, transfer and blocking; immunohistochemistry; and immunofluorescence. An existing professional reference supports the placement, protocol work and laboratory-material responsibilities.": "Practical scope includes serum, peripheral blood, immune cells, cell lines and primary rat cells; cytokine-stimulated and adherent cell cultures, including HaCaT; sterile technique, media preparation, passaging and freezing; Buffy Coat handling and CD4/CD14 isolation; human samples in psoriasis, dermatitis and hidradenitis suppurativa contexts; animal samples and murine lymphoid organs, including personally performed supervised collection/extraction of murine samples; RNA extraction, PCR, electrophoresis and transgenic-mouse genotyping; ELISA; Western blot gel casting, transfer and blocking; immunohistochemistry; and immunofluorescence. An existing professional reference supports the placement, protocol work and laboratory-material responsibilities.",
              "El alcance documentado incluye suero, sangre periférica, células inmunitarias, líneas celulares y células primarias de rata; cultivos celulares estimulados por citocinas y líneas adherentes, incluidas HaCaT; técnica estéril, preparación de medios, pases y congelación; manejo de Buffy Coat y aislamiento CD4/CD14; muestras humanas en contextos de psoriasis, dermatitis e hidradenitis supurativa; muestras animales y órganos linfoides murinos; extracción de ARN, PCR, electroforesis y genotipado de ratones transgénicos; ELISA; preparación de geles de Western blot, transferencia y bloqueo; inmunohistoquímica e inmunofluorescencia. Existe una referencia profesional que respalda las prácticas, el trabajo con protocolos y las responsabilidades sobre material de laboratorio.": "El alcance práctico incluye suero, sangre periférica, células inmunitarias, líneas celulares y células primarias de rata; cultivos celulares estimulados por citocinas y líneas adherentes, incluidas HaCaT; técnica estéril, preparación de medios, pases y congelación; manejo de Buffy Coat y aislamiento CD4/CD14; muestras humanas en contextos de psoriasis, dermatitis e hidradenitis supurativa; muestras animales y órganos linfoides murinos, incluida la obtención/extracción personal y supervisada de muestras murinas; extracción de ARN, PCR, electroforesis y genotipado de ratones transgénicos; ELISA; preparación de geles de Western blot, transferencia y bloqueo; inmunohistoquímica e inmunofluorescencia. Existe una referencia profesional que respalda las prácticas, el trabajo con protocolos y las responsabilidades sobre material de laboratorio.",
              "Der dokumentierte Umfang umfasst Serum, peripheres Blut, Immunzellen, Zelllinien und primäre Rattenzellen; mit Zytokinen stimulierte und adhärente Zellkulturen einschließlich HaCaT; steriles Arbeiten, Medienvorbereitung, Passagieren und Einfrieren; Buffy-Coat-Verarbeitung und CD4/CD14-Isolierung; humane Proben im Kontext von Psoriasis, Dermatitis und Hidradenitis suppurativa; tierische Proben und murine lymphatische Organe; RNA-Extraktion, PCR, Elektrophorese und Genotypisierung transgener Mäuse; ELISA; Western-Blot-Gelherstellung, Transfer und Blocking; Immunhistochemie und Immunfluoreszenz. Eine vorhandene berufliche Referenz bestätigt das Praktikum, die Protokollarbeit und die Verantwortung für Labormaterial.": "Der praktische Umfang umfasst Serum, peripheres Blut, Immunzellen, Zelllinien und primäre Rattenzellen; mit Zytokinen stimulierte und adhärente Zellkulturen einschließlich HaCaT; steriles Arbeiten, Medienvorbereitung, Passagieren und Einfrieren; Buffy-Coat-Verarbeitung und CD4/CD14-Isolierung; humane Proben im Kontext von Psoriasis, Dermatitis und Hidradenitis suppurativa; tierische Proben und murine lymphatische Organe einschließlich persönlich durchgeführter, beaufsichtigter Gewinnung/Entnahme muriner Proben; RNA-Extraktion, PCR, Elektrophorese und Genotypisierung transgener Mäuse; ELISA; Western-Blot-Gelherstellung, Transfer und Blocking; Immunhistochemie und Immunfluoreszenz. Eine vorhandene berufliche Referenz bestätigt das Praktikum, die Protokollarbeit und die Verantwortung für Labormaterial.",
              "technicalEvidenceLead: 'Documented scope includes'": "technicalEvidenceLead: 'Practical scope includes'",
              "technicalEvidenceLead: 'El alcance documentado incluye'": "technicalEvidenceLead: 'El alcance práctico incluye'",
              "technicalEvidenceLead: 'Der dokumentierte Umfang umfasst'": "technicalEvidenceLead: 'Der praktische Umfang umfasst'",
              "{ title: 'Cell culture & samples', body: 'serum, peripheral blood, immune cells, cell lines and primary rat cells; cytokine-stimulated and adherent cell cultures, including HaCaT; sterile technique, media preparation, passaging and freezing; Buffy Coat handling and CD4/CD14 isolation; human samples in psoriasis, dermatitis and hidradenitis suppurativa contexts; animal samples and murine lymphoid organs' },": "{ title: 'Cell culture & samples', body: 'serum, peripheral blood, immune cells, cell lines and primary rat cells; cytokine-stimulated and adherent cell cultures, including HaCaT; sterile technique, media preparation, passaging and freezing; Buffy Coat handling and CD4/CD14 isolation; human samples in psoriasis, dermatitis and hidradenitis suppurativa contexts; animal samples and murine lymphoid organs' },\n                    { title: 'Animal-sample collection', body: 'personally performed, under supervision and established protocols, collection/extraction of murine samples and subsequent handling of animal-derived material' },",
              "{ title: 'Cultivo celular y muestras', body: 'suero, sangre periférica, células inmunitarias, líneas celulares y células primarias de rata; cultivos estimulados por citocinas y líneas adherentes, incluidas HaCaT; técnica estéril, preparación de medios, pases y congelación; manejo de Buffy Coat y aislamiento CD4/CD14; muestras humanas en contextos de psoriasis, dermatitis e hidradenitis supurativa; muestras animales y órganos linfoides murinos' },": "{ title: 'Cultivo celular y muestras', body: 'suero, sangre periférica, células inmunitarias, líneas celulares y células primarias de rata; cultivos estimulados por citocinas y líneas adherentes, incluidas HaCaT; técnica estéril, preparación de medios, pases y congelación; manejo de Buffy Coat y aislamiento CD4/CD14; muestras humanas en contextos de psoriasis, dermatitis e hidradenitis supurativa; muestras animales y órganos linfoides murinos' },\n                    { title: 'Obtención de muestras animales', body: 'obtención/extracción de muestras murinas realizada personalmente, bajo supervisión y protocolos establecidos, y posterior manejo del material de origen animal' },",
              "{ title: 'Zellkultur & Proben', body: 'Serum, peripheres Blut, Immunzellen, Zelllinien und primäre Rattenzellen; mit Zytokinen stimulierte und adhärente Zellkulturen einschließlich HaCaT; steriles Arbeiten, Medienvorbereitung, Passagieren und Einfrieren; Buffy-Coat-Verarbeitung und CD4/CD14-Isolierung; humane Proben im Kontext von Psoriasis, Dermatitis und Hidradenitis suppurativa; tierische Proben und murine lymphatische Organe' },": "{ title: 'Zellkultur & Proben', body: 'Serum, peripheres Blut, Immunzellen, Zelllinien und primäre Rattenzellen; mit Zytokinen stimulierte und adhärente Zellkulturen einschließlich HaCaT; steriles Arbeiten, Medienvorbereitung, Passagieren und Einfrieren; Buffy-Coat-Verarbeitung und CD4/CD14-Isolierung; humane Proben im Kontext von Psoriasis, Dermatitis und Hidradenitis suppurativa; tierische Proben und murine lymphatische Organe' },\n                    { title: 'Entnahme tierischer Proben', body: 'persönlich unter Aufsicht und nach festgelegten Protokollen durchgeführte Gewinnung/Entnahme muriner Proben sowie anschließende Handhabung tierischen Materials' },",
              "disclosure: 'Scope note: this is documented laboratory placement experience, not an independent clinical claim or therapeutic study.'": "disclosure: 'Scope note: this entry combines documentary evidence with personally confirmed supervised hands-on work; it does not claim independent clinical, veterinary or surgical practice.'",
              "disclosure: 'Nota de alcance: se documenta experiencia de prácticas de laboratorio, no una afirmación clínica independiente ni un estudio terapéutico.'": "disclosure: 'Nota de alcance: esta entrada combina evidencia documental con experiencia práctica supervisada confirmada personalmente; no se afirma ejercicio clínico, veterinario o quirúrgico independiente.'",
              "disclosure: 'Hinweis zum Umfang: dokumentierte Laborpraxis, kein eigenständiger klinischer Wirksamkeitsnachweis und keine therapeutische Studie.'": "disclosure: 'Hinweis zum Umfang: Dieser Eintrag kombiniert dokumentarische Nachweise mit persönlich bestätigter beaufsichtigter Praxis; es wird keine eigenständige klinische, tierärztliche oder chirurgische Tätigkeit beansprucht.'"
          }
          for old, new in wb_replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'workbench.js expected exactly one occurrence, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          # Add Animal Experimentation to Technical & Learning navigation.
          group_insertions = {
              "learningItem4: 'Celignis · Analytical and biomass laboratory placement',": "learningItem4: 'Celignis · Analytical and biomass laboratory placement',\n                learningItem5: 'Animal Experimentation A+B+C · 70 h · in-person practical training',",
              "learningItem4: 'Celignis · Prácticas en laboratorio analítico y de biomasa',": "learningItem4: 'Celignis · Prácticas en laboratorio analítico y de biomasa',\n                learningItem5: 'Experimentación Animal A+B+C · 70 h · prácticas presenciales',",
              "learningItem4: 'Celignis · Praktikum im analytischen Biomasse-Labor',": "learningItem4: 'Celignis · Praktikum im analytischen Biomasse-Labor',\n                learningItem5: 'Versuchstierkunde A+B+C · 70 Std. · Präsenzpraxis',"
          }
          for old, new in group_insertions.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'workbench.js missing group insertion anchor: {old}')
              text = text.replace(old, new, 1)

          animal_blocks = {
              "professionalContext: {\n                development: {\n                    kicker: 'Current Development',": "professionalContext: {\n                animalTraining: {\n                    kicker: 'Animal Experimentation · Functions A+B+C',\n                    body: 'Certified 70-hour course under Order ECC/566/2015 with in-person practical training. The formal programme covers animal care, euthanasia and performance of procedures, together with welfare/3Rs, recognition of pain and distress, humane killing methods, minimally invasive procedures, anaesthesia and principles of surgery.',\n                    pointFunctions: 'Functions: A · care of animals; B · euthanasia of animals; C · performance of procedures',\n                    pointProgramme: 'Programme: welfare & 3Rs · pain/suffering/distress recognition · humane killing · minimally invasive procedures · minor and advanced anaesthesia · principles of surgery',\n                    pointHandsOn: 'Personally performed during supervised practical training: animal handling, administration of drugs/substances by injection, anaesthesia and surgical procedures for sample/tissue collection',\n                    pointSamples: 'Personally performed: collection/extraction of animal samples and euthanasia',\n                    scope: 'Scope note: supervised training and practical experience; no claim of independent veterinary or surgical practice.'\n                },\n                development: {\n                    kicker: 'Current Development',",
              "professionalContext: {\n                development: {\n                    kicker: 'Desarrollo actual',": "professionalContext: {\n                animalTraining: {\n                    kicker: 'Experimentación Animal · Funciones A+B+C',\n                    body: 'Curso certificado de 70 horas conforme a la Orden ECC/566/2015 con prácticas presenciales. El programa formal cubre cuidado de animales, eutanasia y realización de procedimientos, junto con bienestar/3R, reconocimiento del dolor y la angustia, métodos humanitarios de sacrificio, procedimientos mínimamente invasivos, anestesia y principios de cirugía.',\n                    pointFunctions: 'Funciones: A · cuidado de animales; B · eutanasia; C · realización de procedimientos',\n                    pointProgramme: 'Programa: bienestar y 3R · reconocimiento de dolor/sufrimiento/angustia · sacrificio humanitario · procedimientos mínimamente invasivos · anestesia básica y avanzada · principios de cirugía',\n                    pointHandsOn: 'Realizado personalmente durante prácticas supervisadas: manejo de animales, administración de fármacos/sustancias mediante inyección, anestesia y procedimientos quirúrgicos para obtención de muestras/tejidos',\n                    pointSamples: 'Realizado personalmente: obtención/extracción de muestras animales y eutanasia',\n                    scope: 'Nota de alcance: formación y experiencia práctica supervisada; no se afirma ejercicio veterinario o quirúrgico independiente.'\n                },\n                development: {\n                    kicker: 'Desarrollo actual',",
              "professionalContext: {\n                development: {\n                    kicker: 'Aktuelle Entwicklung',": "professionalContext: {\n                animalTraining: {\n                    kicker: 'Versuchstierkunde · Funktionen A+B+C',\n                    body: 'Zertifizierter 70-Stunden-Kurs gemäß Erlass ECC/566/2015 mit Präsenzpraxis. Das formale Programm umfasst Tierpflege, Tötung/Euthanasie und Durchführung von Verfahren sowie Tierwohl/3R, Erkennen von Schmerz und Angst, tierschutzgerechte Tötungsmethoden, minimalinvasive Verfahren, Anästhesie und chirurgische Grundlagen.',\n                    pointFunctions: 'Funktionen: A · Tierpflege; B · Tötung/Euthanasie; C · Durchführung von Verfahren',\n                    pointProgramme: 'Programm: Tierwohl & 3R · Erkennen von Schmerz/Leiden/Angst · tierschutzgerechte Tötung · minimalinvasive Verfahren · einfache und fortgeschrittene Anästhesie · chirurgische Grundlagen',\n                    pointHandsOn: 'Persönlich im beaufsichtigten Praxisteil durchgeführt: Tierhandling, Verabreichung von Arzneimitteln/Substanzen per Injektion, Anästhesie und chirurgische Verfahren zur Proben-/Gewebegewinnung',\n                    pointSamples: 'Persönlich durchgeführt: Gewinnung/Entnahme tierischer Proben und Euthanasie',\n                    scope: 'Hinweis zum Umfang: beaufsichtigte Ausbildung und Praxiserfahrung; keine eigenständige tierärztliche oder chirurgische Tätigkeit.'\n                },\n                development: {\n                    kicker: 'Aktuelle Entwicklung',"
          }
          for old, new in animal_blocks.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'workbench.js missing animal-training anchor: {old[:80]}')
              text = text.replace(old, new, 1)

          wb.write_text(text, encoding='utf-8')

          # Workbench HTML: add visible learning link and detailed training block.
          wb_index = Path('workbench/index.html')
          html = wb_index.read_text(encoding='utf-8')
          old_list = '''                            <li><a href="#entry-laprincesa" data-i18n="groups.learningItem3">La Princesa · Clinical and biomedical laboratory placement</a></li>\n                            <li><a href="#entry-celignis" data-i18n="groups.learningItem4">Celignis · Analytical and biomass laboratory placement</a></li>\n                        </ul>'''
          new_list = '''                            <li><a href="#entry-laprincesa" data-i18n="groups.learningItem3">La Princesa · Clinical and biomedical laboratory placement</a></li>\n                            <li><a href="#entry-celignis" data-i18n="groups.learningItem4">Celignis · Analytical and biomass laboratory placement</a></li>\n                            <li><a href="#animal-training" data-i18n="groups.learningItem5">Animal Experimentation A+B+C · 70 h · in-person practical training</a></li>\n                        </ul>'''
          if html.count(old_list) != 1:
              raise RuntimeError('workbench/index.html learning list anchor mismatch')
          html = html.replace(old_list, new_list, 1)

          marker = '''                        <section class="learning-current-development" aria-labelledby="learning-current-development-title">'''
          animal_section = '''                        <section class="learning-current-development" id="animal-training" aria-labelledby="animal-training-title">\n                            <h4 id="animal-training-title" data-i18n="professionalContext.animalTraining.kicker">Animal Experimentation · Functions A+B+C</h4>\n                            <p data-i18n="professionalContext.animalTraining.body">Certified 70-hour course under Order ECC/566/2015 with in-person practical training. The formal programme covers animal care, euthanasia and performance of procedures, together with welfare/3Rs, recognition of pain and distress, humane killing methods, minimally invasive procedures, anaesthesia and principles of surgery.</p>\n                            <ul>\n                                <li data-i18n="professionalContext.animalTraining.pointFunctions">Functions: A · care of animals; B · euthanasia of animals; C · performance of procedures</li>\n                                <li data-i18n="professionalContext.animalTraining.pointProgramme">Programme: welfare &amp; 3Rs · pain/suffering/distress recognition · humane killing · minimally invasive procedures · minor and advanced anaesthesia · principles of surgery</li>\n                                <li data-i18n="professionalContext.animalTraining.pointHandsOn">Personally performed during supervised practical training: animal handling, administration of drugs/substances by injection, anaesthesia and surgical procedures for sample/tissue collection</li>\n                                <li data-i18n="professionalContext.animalTraining.pointSamples">Personally performed: collection/extraction of animal samples and euthanasia</li>\n                            </ul>\n                            <p data-i18n="professionalContext.animalTraining.scope">Scope note: supervised training and practical experience; no claim of independent veterinary or surgical practice.</p>\n                        </section>\n\n'''
          if html.count(marker) != 1:
              raise RuntimeError('workbench/index.html current-development marker mismatch')
          html = html.replace(marker, animal_section + marker, 1)
          wb_index.write_text(html, encoding='utf-8')
          PY

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/translations/en.json >/dev/null
          python3 -m json.tool data/translations/de.json >/dev/null
          python3 -m json.tool data/translations/es.json >/dev/null
          node --check workbench/js/workbench.js
          git diff --check
          git diff --stat

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-fix-animal-experience.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/translations/en.json data/translations/de.json data/translations/es.json index.html workbench/index.html workbench/js/workbench.js .github/workflows/oneoff-fix-animal-experience.yml
          git diff --cached --check
          git commit -m 'fix: restore hands-on animal experience details'
          git push origin HEAD:main
