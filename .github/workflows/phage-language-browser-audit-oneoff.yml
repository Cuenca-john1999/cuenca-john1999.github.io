name: Phage language browser audit one-off

on:
  push:
    branches:
      - audit/phage-language-docs-current-2026-08-08

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Selenium
        run: python3 -m pip install --quiet selenium
      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          sleep 2
      - name: Audit language-specific final project routing
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base = 'http://127.0.0.1:8000/'
          expected = {
              'en': ('_EN.pdf', 'original academic work is the Spanish version', 'Unofficial English translation'),
              'de': ('_DE.pdf', 'akademische Original ist die spanische Fassung', 'Inoffizielle deutsche Übersetzung'),
              'es': ('_ES.pdf', 'trabajo académico original', 'Trabajo final original'),
          }
          failures = []
          checks = []

          def check(name, condition, detail=''):
              checks.append({'name': name, 'ok': bool(condition), 'detail': detail})
              if not condition:
                  failures.append(f'{name}: {detail}')

          for filename in (
              'assets/documents/bacteriophage-therapy-final-project_EN.pdf',
              'assets/documents/bacteriophage-therapy-final-project_DE.pdf',
              'assets/documents/bacteriophage-therapy-final-project_ES.pdf',
          ):
              with urllib.request.urlopen(base + filename) as response:
                  check(f'PDF HTTP 200 {filename}', response.status == 200, str(response.status))

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 12)

          try:
              for lang, (suffix, notice, label_fragment) in expected.items():
                  driver.get(f'{base}?lang={lang}')
                  wait.until(lambda d: d.find_element(By.TAG_NAME, 'html').get_attribute('lang') == lang)
                  links = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, '[data-final-project-link]'))
                  check(f'main has two final project links {lang}', len(links) == 2, str(len(links)))
                  for idx, link in enumerate(links):
                      href = link.get_attribute('href') or ''
                      check(f'main {lang} link {idx+1}', href.endswith(suffix), href)

                  notice_text = driver.execute_script("return document.querySelector('[data-i18n-html=\"educationCards.clinical.finalProject\"]').textContent || '';")
                  check(f'main {lang} notice', notice.lower() in notice_text.lower(), notice_text)

                  driver.execute_script("document.querySelector('[data-final-project-link]').click();")
                  wait.until(lambda d: not d.find_element(By.ID, 'document-explorer').get_attribute('hidden'))
                  fallback_href = driver.find_element(By.ID, 'document-explorer-fallback').get_attribute('href') or ''
                  explorer_label = driver.find_element(By.ID, 'document-explorer-label').text
                  check(f'main {lang} explorer fallback', fallback_href.endswith(suffix), fallback_href)
                  check(f'main {lang} explorer label', label_fragment.lower() in explorer_label.lower(), explorer_label)

                  driver.get(f'{base}workbench/?lang={lang}')
                  wait.until(lambda d: d.find_element(By.TAG_NAME, 'html').get_attribute('lang') == lang)
                  buttons = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, '[data-entry-open="phage"]'))
                  time.sleep(0.5)
                  visible = [button for button in buttons if button.is_displayed()]
                  target = visible[-1] if visible else buttons[-1]
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'}); arguments[0].click();", target)
                  wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, '.dialog-resource'))
                  resources = driver.find_elements(By.CSS_SELECTOR, '.dialog-resource')
                  project_resources = [r for r in resources if 'bacteriophage-therapy-final-project_' in (r.get_attribute('href') or '')]
                  check(f'Workbench {lang} one localized project resource', len(project_resources) == 1, str([r.get_attribute('href') for r in resources]))
                  if project_resources:
                      href = project_resources[0].get_attribute('href') or ''
                      check(f'Workbench {lang} project href', href.endswith(suffix), href)
                      check(f'Workbench {lang} resource label', label_fragment.lower() in project_resources[0].text.lower(), project_resources[0].text)
                  dialog_text = driver.execute_script("return document.querySelector('[data-dialog-page-content]').textContent || '';")
                  check(f'Workbench {lang} notice', notice.lower() in dialog_text.lower(), dialog_text[:1000])

              severe = [entry for entry in driver.get_log('browser') if entry.get('level') == 'SEVERE']
              check('browser console has no SEVERE errors', not severe, json.dumps(severe, ensure_ascii=False))
          except Exception as exc:
              failures.append(f'auditor exception: {type(exc).__name__}: {exc}')
          finally:
              driver.quit()

          report = {'checks': checks, 'failures': failures}
          print(json.dumps(report, indent=2, ensure_ascii=False))
          with open('/tmp/phage-language-browser-audit.json', 'w', encoding='utf-8') as fh:
              json.dump(report, fh, indent=2, ensure_ascii=False)
          if failures:
              raise SystemExit(1)
          PY
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phage-language-browser-audit
          path: /tmp/phage-language-browser-audit.json
