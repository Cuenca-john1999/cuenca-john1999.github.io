name: Temporary patch LLC migration

on:
  push:
    branches:
      - update/llc-portfolio-migration
    paths:
      - .github/workflows/temp-patch-llc-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: update/llc-portfolio-migration
          fetch-depth: 0

      - name: Patch migration workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/temp-llc-portfolio-migration.yml"); t=p.read_text(encoding="utf-8"); changes=[("7b8f5d4c2e10","ee2b3e1dc913"),("deutschlandspezifischem Verhalten","deutschspezifischem Verhalten"),("runs de procesamiento","ejecuciones de procesamiento"),("bestätigtem Speicher-Workflow","Workflow zur bestätigten Speicherung")]; [( (_ for _ in ()).throw(SystemExit(f"missing marker: {a}")) if a not in t else None) for a,b in changes]; [None for a,b in changes if not (globals().update(t=t.replace(a,b)))]; p.write_text(t,encoding="utf-8")'
          git diff --check
          git diff --name-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-llc-portfolio-migration.yml
          git diff --cached --check
          git commit -m 'chore: align LLC migration hashes and wording'
          git push origin HEAD:update/llc-portfolio-migration
