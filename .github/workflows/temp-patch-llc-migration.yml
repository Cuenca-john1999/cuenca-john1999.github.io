name: Temporary patch LLC migration

on:
  push:
    branches:
      - update/llc-portfolio-migration
    paths:
      - .github/workflows/temp-patch-llc-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: update/llc-portfolio-migration
          fetch-depth: 0

      - name: Patch integrity guard scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/verify_portfolio_integrity.py')
          text = p.read_text(encoding='utf-8')
          old = '    language_js = (ROOT / "assets" / "js" / "language.js").read_text(encoding="utf-8")\n\n'
          new = old + '    translations = load_translations()\n\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one integrity insertion point, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff --name-status
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify_portfolio_integrity.py
          git diff --cached --check
          git commit -m 'chore: prepare LLC integrity guard scope'
          git push origin HEAD:update/llc-portfolio-migration
