name: Temporary patch LLC migration

on:
  push:
    branches:
      - update/llc-portfolio-migration
    paths:
      - .github/workflows/temp-patch-llc-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: update/llc-portfolio-migration
          fetch-depth: 0

      - name: Patch migration workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/temp-llc-portfolio-migration.yml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'deutschlandspezifischem Verhalten': 'deutschspezifischem Verhalten',
              'runs de procesamiento': 'ejecuciones de procesamiento',
              'bestätigtem Speicher-Workflow': 'Workflow zur bestätigten Speicherung',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing editorial marker: {old}')
              text = text.replace(old, new)

          needle = "          python3 tools/generate_localized_pages.py\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected one generator call marker, found {text.count(needle)}')

          hash_sync = r'''          python3 - <<'PYHASH'
          import hashlib
          import re
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()[:12]

          def sync(page_path, asset_path, expected_count=1):
              page = Path(page_path)
              text = page.read_text(encoding='utf-8')
              token = digest(asset_path)
              pattern = re.compile(rf'({re.escape(asset_path)}\?v=)[0-9a-f]{{12}}')
              updated, count = pattern.subn(rf'\g<1>{token}', text)
              if count != expected_count:
                  raise SystemExit(f'{page_path}: expected {expected_count} cache reference(s) for {asset_path}, found {count}')
              page.write_text(updated, encoding='utf-8')

          sync('index.html', 'assets/js/language.js')
          sync('workbench/index.html', 'js/workbench-data.js')
          sync('workbench/index.html', 'js/workbench.js')
          PYHASH

'''
          text = text.replace(needle, hash_sync + needle)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff --name-status
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-llc-portfolio-migration.yml
          git diff --cached --check
          git commit -m 'chore: make LLC migration cache-safe'
          git push origin HEAD:update/llc-portfolio-migration
