name: Browser professionalization audit

on:
  push:
    branches:
      - audit/professionalization-2026-08-07

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python3 -m pip install --break-system-packages selenium
      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          sleep 2
      - name: Run browser audit
        run: python3 .github/scripts/browser_professionalization_smoke.py
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professionalization-browser-audit
          path: browser-audit/
