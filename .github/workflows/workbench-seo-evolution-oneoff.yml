name: Workbench and SEO evolution one-off

on:
  push:
    branches:
      - audit/workbench-seo-protection-2026-08-08

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/workbench-seo-protection-2026-08-08
          fetch-depth: 0

      - name: Apply guarded evolution
        run: python3 tools/_apply_workbench_seo_evolution.py

      - name: Verify integrity
        run: python3 tools/verify_portfolio_integrity.py

      - name: Verify JavaScript syntax
        run: |
          node --check assets/js/language.js
          node --check assets/js/app.js
          node --check workbench/js/workbench.js

      - name: Verify diff cleanliness
        run: |
          git diff --check
          git diff --name-status
          git diff --stat

      - name: Commit audited production changes
        run: |
          set -euo pipefail
          git config user.name "Jhon Cuenca"
          git config user.email "72253286+Cuenca-john1999@users.noreply.github.com"
          git add workbench/index.html workbench/js/workbench.js tools/verify_portfolio_integrity.py
          git diff --cached --check
          git commit -m "feat: strengthen Workbench evidence and search discovery"
          git push origin HEAD:audit/workbench-seo-protection-2026-08-08
