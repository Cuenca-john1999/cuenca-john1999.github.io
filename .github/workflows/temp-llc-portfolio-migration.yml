          )
          PY

          # Compute cache tokens from the actual modified files before generating localized routes.
          python3 - <<'PYHASH'
          import hashlib
          import re
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()[:12]

          def sync(page_path, reference_path, file_path):
              page = Path(page_path)
              text = page.read_text(encoding='utf-8')
              token = digest(file_path)
              pattern = re.compile(rf'({re.escape(reference_path)}\?v=)[0-9a-f]{{12}}')
              updated, count = pattern.subn(rf'\g<1>{token}', text)
              if count != 1:
                  raise SystemExit(f'{page_path}: expected one cache reference for {reference_path}, found {count}')
              page.write_text(updated, encoding='utf-8')

          sync('index.html', 'assets/js/language.js', 'assets/js/language.js')
          sync('workbench/index.html', 'js/workbench-data.js', 'workbench/js/workbench-data.js')
          sync('workbench/index.html', 'js/workbench.js', 'workbench/js/workbench.js')
          PYHASH

          python3 tools/generate_localized_pages.py

