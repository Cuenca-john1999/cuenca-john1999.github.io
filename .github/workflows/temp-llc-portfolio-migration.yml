          replace_entry('en', en_entry)
          replace_entry('es', es_entry)
          replace_entry('de', de_entry)

          # Workbench UI: same project/deep link, now with a second internal page.
          replace('workbench/js/workbench.js', '        deutschos: 1,', '        deutschos: 2,')
          replace('workbench/js/workbench.js', "            deutschos: ['dialog.overview'],", "            deutschos: ['dialog.overview', 'dialog.llcDetails'],")
          replace('workbench/js/workbench.js', "        if (entryId === 'portfolio') renderPortfolioDetails(dialogPageContent, data, pageTitles[pageIndex]);", "        if (entryId === 'deutschos' || entryId === 'portfolio') renderPortfolioDetails(dialogPageContent, data, pageTitles[pageIndex]);")

          # Integrity guards: current identity, historical continuity and repository evidence.
          replace(
              'tools/verify_portfolio_integrity.py',
              '    for required in ("DeutschOS", "AETEL 2025", "Bacteriophage Therapy"):',
              '    for required in ("LLC — Laboratory Language Companion", "AETEL 2025", "Bacteriophage Therapy"):'
          )
          replace(
              'tools/verify_portfolio_integrity.py',
              '    for entry_id in (\n',
