name: Workbench SEO browser audit one-off

on:
  push:
    branches:
      - audit/workbench-seo-protection-2026-08-08

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Selenium
        run: python3 -m pip install --quiet selenium
      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/workbench-seo-http.log 2>&1 &
          echo $! > /tmp/workbench-seo-http.pid
          sleep 2
      - name: Audit Workbench evolution
        run: python3 tools/_audit_workbench_seo_browser.py
      - name: Upload browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-seo-browser-audit
          path: /tmp/workbench-seo-browser-audit
