name: Portfolio integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify content and translations
        run: python3 tools/verify_portfolio_integrity.py
      - name: Verify Workbench evidence provenance
        run: python3 tools/verify_workbench_evidence.py
      - name: Verify Google Search Console file
        run: |
          set -euo pipefail
          expected='daa88f47c44fd0d0820b6012296a54cdc650f5bc6c49c6adacd96e8eb9cd836d  google0d3f7f1b6c14262e.html'
          actual="$(sha256sum google0d3f7f1b6c14262e.html)"
          test "$actual" = "$expected"
      - name: Verify JavaScript syntax
        run: |
          node --check assets/js/language.js
          node --check assets/js/app.js
          node --check workbench/js/workbench.js
          node --check assets/js/auxiliary-pages.js
