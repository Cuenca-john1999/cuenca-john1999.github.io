name: Phage language documents clean one-off

on:
  push:
    branches:
      - audit/phage-language-docs-current-2026-08-08

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply language-specific document routing
        run: python3 tools/apply_phage_language_docs_clean.py

      - name: Verify repository
        run: |
          python3 tools/verify_portfolio_integrity.py
          node --check assets/js/language.js
          node --check assets/js/app.js
          node --check workbench/js/workbench.js
          node --check assets/js/auxiliary-pages.js
          git diff --check
          git diff --name-status
          git diff --stat

      - name: Commit audited change and remove one-off files
        run: |
          rm tools/apply_phage_language_docs_clean.py
          rm .github/workflows/phage-language-docs-clean-oneoff.yml
          git config user.name "Jhon Cuenca"
          git config user.email "72253286+Cuenca-john1999@users.noreply.github.com"
          git add \
            index.html \
            assets/js/language.js \
            data/translations/en.json \
            data/translations/de.json \
            data/translations/es.json \
            workbench/index.html \
            workbench/js/workbench.js \
            privacy.html \
            404.html \
            tools/verify_portfolio_integrity.py \
            tools/apply_phage_language_docs_clean.py \
            .github/workflows/phage-language-docs-clean-oneoff.yml
          git diff --cached --check
          git diff --cached --name-status
          git diff --cached --stat
          git commit -m "feat: route bacteriophage project by language"
          git push origin HEAD:audit/phage-language-docs-current-2026-08-08
