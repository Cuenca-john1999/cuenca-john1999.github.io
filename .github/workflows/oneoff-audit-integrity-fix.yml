name: One-off audit integrity preservation fix

on:
  push:
    paths:
      - '.github/workflows/oneoff-audit-integrity-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify base
        run: test "$(git rev-parse HEAD^)" = "e605026d3cc867aad6200783bce5db543b131dca"

      - name: Preserve prior wording while retaining new detail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          updates = {
            'en': {
              ('experienceCards','immunology','role'): 'Biomedical laboratory trainee with progressive responsibility in cell culture workflows, molecular biology support, immunology techniques and animal-sample extraction procedures. During supervised animal-sample procedures, I personally performed murine sample collection/extraction and subsequent handling.',
              ('skillsEvidence','academic','animalModels'): 'Animal Experimentation course · Functions A+B+C · 70 h · in-person practical training · care, euthanasia and performance of procedures · anaesthesia and surgical principles',
              ('responsibilityCards','princesa','body'): 'My role evolved from trainee participation to specific responsibility within the cell culture workflow. I was trusted with cell handling, maintenance and related laboratory routines, and was frequently called to support animal-sample extraction procedures and molecular or immunology workflows. During supervised animal-sample procedures, I personally performed murine sample collection/extraction and subsequent sample handling.'
            },
            'es': {
              ('experienceCards','immunology','role'): 'Estudiante en prácticas de laboratorio biomédico con responsabilidad progresiva en flujos de cultivo celular, apoyo en biología molecular, técnicas de inmunología y procedimientos con muestras animales. Durante procedimientos supervisados con muestras animales, realicé personalmente la obtención/extracción de muestras murinas y su posterior manejo.',
              ('skillsEvidence','academic','animalModels'): 'Curso de Experimentación Animal · Funciones A+B+C · 70 h · prácticas presenciales · cuidado, eutanasia y realización de procedimientos · anestesia y principios quirúrgicos',
              ('responsibilityCards','princesa','body'): 'Mi papel evolucionó desde la participación como estudiante en prácticas hasta una responsabilidad concreta dentro del flujo de cultivo celular. Se me confió el manejo, mantenimiento y rutinas relacionadas con células, y se me llamaba con frecuencia para apoyar procedimientos con muestras animales y flujos de biología molecular o inmunología. Durante procedimientos supervisados con muestras animales, realicé personalmente la obtención/extracción de muestras murinas y su posterior manejo.'
            },
            'de': {
              ('experienceCards','immunology','role'): 'Praktikant im biomedizinischen Labor mit wachsender Verantwortung in Zellkulturabläufen, molekularbiologischer Unterstützung, immunologischen Techniken und Verfahren mit Tierproben. Bei beaufsichtigten Verfahren mit Tierproben führte ich die Gewinnung/Entnahme muriner Proben persönlich durch und übernahm anschließend deren Handhabung.',
              ('skillsEvidence','academic','animalModels'): 'Kurs Versuchstierkunde · Funktionen A+B+C · 70 Std. · Präsenzpraxis · Tierpflege, Tötung/Euthanasie und Durchführung von Verfahren · Anästhesie und chirurgische Grundlagen',
              ('responsibilityCards','princesa','body'): 'Meine Rolle entwickelte sich von der Praktikumsteilnahme zu konkreter Verantwortung im Zellkulturworkflow. Mir wurden Zellhandling, Pflege und zugehörige Laborroutinen anvertraut, und ich wurde regelmäßig zur Unterstützung bei Verfahren mit Tierproben sowie molekularbiologischen oder immunologischen Workflows hinzugezogen. Bei beaufsichtigten Verfahren mit Tierproben führte ich die Gewinnung/Entnahme muriner Proben persönlich durch und übernahm anschließend deren Handhabung.'
            }
          }

          for lang, changes in updates.items():
              path = Path(f'data/translations/{lang}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              for keys, value in changes.items():
                  node = data
                  for key in keys[:-1]:
                      node = node[key]
                  node[keys[-1]] = value
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Keep English no-JS role fallback additive rather than rewritten.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'Biomedical laboratory trainee with progressive responsibility in cell culture workflows, molecular biology support and immunology techniques. During supervised animal-sample procedures, I personally performed murine sample collection/extraction and subsequent handling.'
          new = updates['en'][('experienceCards','immunology','role')]
          if text.count(old) != 1:
              raise RuntimeError(f'index.html role anchor count = {text.count(old)}')
          text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          # Restore the previous scope disclaimer and retain the new supervision/practice disclaimer.
          wb = Path('workbench/js/workbench.js')
          text = wb.read_text(encoding='utf-8')
          replacements = {
              "disclosure: 'Scope note: this entry combines documentary evidence with personally confirmed supervised hands-on work; it does not claim independent clinical, veterinary or surgical practice.'": "disclosure: 'Scope note: this entry combines documentary evidence with personally confirmed supervised hands-on work. This is documented laboratory placement experience, not an independent clinical claim or therapeutic study, and it does not claim independent clinical, veterinary or surgical practice.'",
              "disclosure: 'Nota de alcance: esta entrada combina evidencia documental con experiencia práctica supervisada confirmada personalmente; no se afirma ejercicio clínico, veterinario o quirúrgico independiente.'": "disclosure: 'Nota de alcance: esta entrada combina evidencia documental con experiencia práctica supervisada confirmada personalmente. Se documenta experiencia de prácticas de laboratorio, no una afirmación clínica independiente ni un estudio terapéutico, y no se afirma ejercicio clínico, veterinario o quirúrgico independiente.'",
              "disclosure: 'Hinweis zum Umfang: Dieser Eintrag kombiniert dokumentarische Nachweise mit persönlich bestätigter beaufsichtigter Praxis; es wird keine eigenständige klinische, tierärztliche oder chirurgische Tätigkeit beansprucht.'": "disclosure: 'Hinweis zum Umfang: Dieser Eintrag kombiniert dokumentarische Nachweise mit persönlich bestätigter beaufsichtigter Praxis. Es handelt sich um dokumentierte Laborpraxis, nicht um einen eigenständigen klinischen Wirksamkeitsnachweis oder eine therapeutische Studie; ebenso wird keine eigenständige klinische, tierärztliche oder chirurgische Tätigkeit beansprucht.'"
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'workbench.js disclosure anchor count = {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          wb.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/translations/en.json >/dev/null
          python3 -m json.tool data/translations/de.json >/dev/null
          python3 -m json.tool data/translations/es.json >/dev/null
          node --check workbench/js/workbench.js
          git diff --check
          rm .github/workflows/oneoff-audit-integrity-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/translations/en.json data/translations/de.json data/translations/es.json index.html workbench/js/workbench.js .github/workflows/oneoff-audit-integrity-fix.yml
          git diff --cached --check
          git commit -m 'fix: preserve prior portfolio wording during animal detail expansion'
          git push origin HEAD:main
