name: Education visual audit one-off

on:
  push:
    branches:
      - audit/education-visual-2026-08-07

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/education-visual-2026-08-07
          fetch-depth: 0

      - name: Apply conservative education update
        run: python tools/apply_education_visual_audit.py

      - name: Verify portfolio integrity
        run: python tools/verify_portfolio_integrity.py

      - name: Verify JavaScript syntax
        run: node --check assets/js/language.js

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit audited web changes
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html assets/css/layout.css assets/js/language.js data/translations/en.json data/translations/de.json data/translations/es.json tools/verify_portfolio_integrity.py; then
            echo 'No web changes to commit.'
            exit 0
          fi
          git config user.name 'Jhon M. Cuenca'
          git config user.email '72253286+Cuenca-john1999@users.noreply.github.com'
          git add \
            index.html \
            assets/css/layout.css \
            assets/js/language.js \
            data/translations/en.json \
            data/translations/de.json \
            data/translations/es.json \
            tools/verify_portfolio_integrity.py
          git diff --cached --check
          git commit -m 'feat: enrich education evidence and credential layout'
          git push origin HEAD:audit/education-visual-2026-08-07
