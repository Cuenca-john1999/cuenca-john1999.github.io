name: One-off location and mobility update

on:
  push:
    paths:
      - '.github/workflows/oneoff-location-mobility-update.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded location and mobility update
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('data/translations/en.json'): [
                  (
                      '"availability": "Available for laboratory-related, clinical research support and biomedical science opportunities in Germany and internationally."',
                      '"availability": "Available in the Bonn–Cologne region, Berlin and Madrid, with relocation open throughout Germany and internationally."'
                  ),
                  (
                      '"body": "I hold Spanish vocational qualifications as Técnico Superior en Laboratorio Clínico y Biomédico (Higher Technician in Clinical and Biomedical Laboratory) and Técnico en Operaciones de Laboratorio (Technician in Laboratory Operations). Based in Berlin, I apply this training to clinical diagnostics, molecular biology, immunology and analytical laboratory work under GLP standards."',
                      '"body": "I hold Spanish vocational qualifications as Técnico Superior en Laboratorio Clínico y Biomédico (Higher Technician in Clinical and Biomedical Laboratory) and Técnico en Operaciones de Laboratorio (Technician in Laboratory Operations). I am currently based in the Bonn–Cologne region, with additional geographic availability in Berlin and Madrid, and I apply this training to clinical diagnostics, molecular biology, immunology and analytical laboratory work under GLP standards."'
                  ),
                  ('"label": "Location"', '"label": "Current location"'),
                  ('"value": "Berlin, Germany"', '"value": "Bonn–Cologne region, Germany"'),
                  ('"label": "Availability"', '"label": "Availability & mobility"'),
                  (
                      '"value": "Available in Germany and internationally · Open to relocation within Germany"',
                      '"value": "Bonn–Cologne region · Berlin · Madrid · Open to relocation throughout Germany and internationally"'
                  ),
                  (
                      '"body": "Available for laboratory-related, clinical research support and biomedical science opportunities in Germany and internationally. My professional interests include molecular biology, immunology, translational research, scientific communication and international collaboration in laboratory environments."',
                      '"body": "Available in the Bonn–Cologne region, Berlin and Madrid, and open to relocation throughout Germany and internationally. My professional interests include molecular biology, immunology, translational research, scientific communication and international collaboration in laboratory environments."'
                  ),
              ],
              Path('data/translations/de.json'): [
                  (
                      '"availability": "Verfügbar für laborbezogene Positionen, Unterstützung in klinischer Forschung und biomedizinische Wissenschaft in Deutschland und international."',
                      '"availability": "Verfügbar im Raum Bonn/Köln, in Berlin und Madrid; deutschlandweit und international umzugsbereit."'
                  ),
                  (
                      '"body": "Ich verfüge über spanische berufliche Qualifikationen: Técnico Superior en Laboratorio Clínico y Biomédico (englische Übersetzung: Higher Technician in Clinical and Biomedical Laboratory) und Técnico en Operaciones de Laboratorio (englische Übersetzung: Technician in Laboratory Operations). In Berlin wende ich diese Ausbildung in klinischer Diagnostik, Molekularbiologie, Immunologie und analytischer Laborarbeit nach GLP-Standards an."',
                      '"body": "Ich verfüge über spanische berufliche Qualifikationen: Técnico Superior en Laboratorio Clínico y Biomédico (englische Übersetzung: Higher Technician in Clinical and Biomedical Laboratory) und Técnico en Operaciones de Laboratorio (englische Übersetzung: Technician in Laboratory Operations). Aktuell bin ich im Raum Bonn/Köln verfügbar; weitere Standortmöglichkeiten bestehen in Berlin und Madrid. Ich wende diese Ausbildung in klinischer Diagnostik, Molekularbiologie, Immunologie und analytischer Laborarbeit nach GLP-Standards an."'
                  ),
                  ('"label": "Standort"', '"label": "Aktueller Standort"'),
                  ('"value": "Berlin, Deutschland"', '"value": "Raum Bonn/Köln, Deutschland"'),
                  ('"label": "Verfügbarkeit"', '"label": "Verfügbarkeit & Mobilität"'),
                  (
                      '"value": "In Deutschland und international verfügbar · umzugsbereit innerhalb Deutschlands"',
                      '"value": "Raum Bonn/Köln · Berlin · Madrid · deutschlandweit und international umzugsbereit"'
                  ),
                  (
                      '"body": "Verfügbar für laborbezogene Positionen, Unterstützung in klinischer Forschung und biomedizinische Wissenschaft in Deutschland und international. Meine beruflichen Interessen umfassen Molekularbiologie, Immunologie, translationale Forschung, Wissenschaftskommunikation und internationale Zusammenarbeit im Laborumfeld."',
                      '"body": "Verfügbar im Raum Bonn/Köln, in Berlin und Madrid sowie deutschlandweit und international umzugsbereit. Meine beruflichen Interessen umfassen Molekularbiologie, Immunologie, translationale Forschung, Wissenschaftskommunikation und internationale Zusammenarbeit im Laborumfeld."'
                  ),
              ],
              Path('data/translations/es.json'): [
                  (
                      '"availability": "Disponible para oportunidades relacionadas con laboratorio, apoyo a investigación clínica y ciencia biomédica en Alemania y a nivel internacional."',
                      '"availability": "Disponible en la zona Bonn–Colonia, Berlín y Madrid, con reubicación abierta en toda Alemania y a nivel internacional."'
                  ),
                  (
                      '"body": "Cuento con titulaciones españolas de Técnico Superior en Laboratorio Clínico y Biomédico y Técnico en Operaciones de Laboratorio. Actualmente resido en Berlín y aplico esta formación al diagnóstico clínico, la biología molecular, la inmunología y el trabajo analítico de laboratorio bajo normas de buenas prácticas de laboratorio."',
                      '"body": "Cuento con titulaciones españolas de Técnico Superior en Laboratorio Clínico y Biomédico y Técnico en Operaciones de Laboratorio. Actualmente estoy en la zona Bonn–Colonia, con disponibilidad adicional en Berlín y Madrid, y aplico esta formación al diagnóstico clínico, la biología molecular, la inmunología y el trabajo analítico de laboratorio bajo normas de buenas prácticas de laboratorio."'
                  ),
                  ('"label": "Ubicación"', '"label": "Ubicación actual"'),
                  ('"value": "Berlín, Alemania"', '"value": "Zona Bonn–Colonia, Alemania"'),
                  ('"label": "Disponibilidad"', '"label": "Disponibilidad y movilidad"'),
                  (
                      '"value": "Disponible en Alemania y a nivel internacional · Abierto a reubicación dentro de Alemania"',
                      '"value": "Zona Bonn–Colonia · Berlín · Madrid · abierto a reubicación en toda Alemania y a nivel internacional"'
                  ),
                  (
                      '"body": "Disponible para oportunidades relacionadas con laboratorio, apoyo a investigación clínica y ciencia biomédica en Alemania y a nivel internacional. Mis intereses profesionales incluyen la biología molecular, la inmunología, la investigación traslacional, la comunicación científica y la colaboración internacional en entornos de laboratorio."',
                      '"body": "Disponible en la zona Bonn–Colonia, Berlín y Madrid, y abierto a reubicación en toda Alemania y a nivel internacional. Mis intereses profesionales incluyen la biología molecular, la inmunología, la investigación traslacional, la comunicación científica y la colaboración internacional en entornos de laboratorio."'
                  ),
              ],
              Path('index.html'): [
                  (
                      'Available for laboratory-related, clinical research support and biomedical science opportunities in Germany and internationally.',
                      'Available in the Bonn–Cologne region, Berlin and Madrid, with relocation open throughout Germany and internationally.'
                  ),
                  (
                      'I hold Spanish vocational qualifications as Técnico Superior en Laboratorio Clínico y Biomédico (Higher Technician in Clinical and Biomedical Laboratory) and Técnico en Operaciones de Laboratorio (Technician in Laboratory Operations). Based in Berlin, I apply this training to clinical diagnostics, molecular biology, immunology and analytical laboratory work under GLP standards.',
                      'I hold Spanish vocational qualifications as Técnico Superior en Laboratorio Clínico y Biomédico (Higher Technician in Clinical and Biomedical Laboratory) and Técnico en Operaciones de Laboratorio (Technician in Laboratory Operations). I am currently based in the Bonn–Cologne region, with additional geographic availability in Berlin and Madrid, and I apply this training to clinical diagnostics, molecular biology, immunology and analytical laboratory work under GLP standards.'
                  ),
                  ('data-i18n="snapshot.location.label">Location</dt>', 'data-i18n="snapshot.location.label">Current location</dt>'),
                  ('data-i18n="snapshot.location.value">Berlin, Germany</dd>', 'data-i18n="snapshot.location.value">Bonn–Cologne region, Germany</dd>'),
                  ('data-i18n="snapshot.availability.label">Availability</dt>', 'data-i18n="snapshot.availability.label">Availability &amp; mobility</dt>'),
                  (
                      'data-i18n="snapshot.availability.value">Available in Germany and internationally · Open to relocation within Germany</dd>',
                      'data-i18n="snapshot.availability.value">Bonn–Cologne region · Berlin · Madrid · Open to relocation throughout Germany and internationally</dd>'
                  ),
                  (
                      'Available for laboratory-related, clinical research support and biomedical science opportunities in Germany and internationally. My professional interests include molecular biology, immunology, translational research, scientific communication and international collaboration in laboratory environments.',
                      'Available in the Bonn–Cologne region, Berlin and Madrid, and open to relocation throughout Germany and internationally. My professional interests include molecular biology, immunology, translational research, scientific communication and international collaboration in laboratory environments.'
                  ),
                  ('assets/js/language.js?v=20260802-approved-enrichment', 'assets/js/language.js?v=20260807-location-mobility'),
              ],
              Path('assets/js/language.js'): [
                  ("const TRANSLATION_VERSION = '20260802-approved-enrichment';", "const TRANSLATION_VERSION = '20260807-location-mobility';"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly 1 occurrence, found {count}: {old[:100]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          python -m json.tool data/translations/en.json >/dev/null
          python -m json.tool data/translations/de.json >/dev/null
          python -m json.tool data/translations/es.json >/dev/null
          node --check assets/js/language.js
          git diff --check
          test -z "$(git diff --name-only | grep -Ev '^(index.html|assets/js/language.js|data/translations/(en|de|es)\.json)$')"
          grep -Fq 'Bonn–Cologne region, Germany' index.html
          grep -Fq 'Raum Bonn/Köln · Berlin · Madrid · deutschlandweit und international umzugsbereit' data/translations/de.json
          grep -Fq 'Zona Bonn–Colonia · Berlín · Madrid · abierto a reubicación en toda Alemania y a nivel internacional' data/translations/es.json
          ! grep -Fq 'Currently resido en Berlín' data/translations/es.json

      - name: Commit changes and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-location-mobility-update.yml
          git add index.html assets/js/language.js data/translations/en.json data/translations/de.json data/translations/es.json
          git commit -m 'feat: clarify geographic availability and mobility'
          git push
